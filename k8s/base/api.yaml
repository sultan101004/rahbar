# The API: reads the index, never writes it. 3 replicas, three probes, zero-downtime rollout.
# Resource numbers come from measured peaks (docs/ENGINEERING-NOTES.md, question 4).
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: rahbar
  labels: {app: api}
spec:
  type: ClusterIP
  selector: {app: api}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: rahbar
  labels: {app: api, app.kubernetes.io/part-of: rahbar}
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0             # a new pod must be READY before an old one goes
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api, app.kubernetes.io/part-of: rahbar}
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      # no CHROMA_PORT=tcp://... service-link env: Chroma reads CHROMA_* as its config
      enableServiceLinks: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: rahbar-api
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: rahbar-config}
          env:
            - name: LLM_API_KEY                  # only used in hosted mode
              valueFrom:
                secretKeyRef: {name: rahbar-secret, key: LLM_API_KEY, optional: true}
          startupProbe:    # finished booting? liveness and readiness wait while this runs
            httpGet: {path: /healthz, port: 8000}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:   # still working? failure: the kubelet restarts the container
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:  # can it take traffic? failure: removed from the Service only
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          lifecycle:
            preStop:       # leave the Service endpoints before uvicorn stops accepting
              exec: {command: ["sleep", "10"]}
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: rahbar
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
