# Chroma: the vector store. A StatefulSet, not a Deployment (docs/ARCHITECTURE.md): it owns
# one PVC by stable identity (chroma-data-chroma-0), so a rescheduled pod re-attaches the
# same index instead of starting empty, and a rollout never runs two writers on one volume.
apiVersion: v1
kind: Service
metadata:
  name: chroma-headless
  namespace: rahbar
  labels: {app: chroma}
spec:
  clusterIP: None
  selector: {app: chroma}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: v1
kind: Service
metadata:
  name: chroma
  namespace: rahbar
  labels: {app: chroma}
spec:
  type: ClusterIP
  selector: {app: chroma}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
  namespace: rahbar
  labels: {app: chroma, app.kubernetes.io/part-of: rahbar}
spec:
  serviceName: chroma-headless
  replicas: 1
  selector:
    matchLabels: {app: chroma}
  template:
    metadata:
      labels: {app: chroma, app.kubernetes.io/part-of: rahbar}
    spec:
      serviceAccountName: chroma
      automountServiceAccountToken: false
      # no CHROMA_PORT=tcp://... service-link env: Chroma reads CHROMA_* as its config
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # local-path / hostPath provisioners (kind, minikube) ignore fsGroup, so the volume
        # is root-owned and the non-root server cannot write it. This init container is the
        # one exception to runAsNonRoot: it only chowns the data directory, with every
        # capability dropped except CHOWN, then exits.
        - name: fix-permissions
          image: busybox:1.37.0
          command: ["sh", "-c", "chown -R 1000:1000 /data"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 16Mi}
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          volumeMounts:
            - {name: chroma-data, mountPath: /data}
      containers:
        - name: chroma
          image: chromadb/chroma:1.0.12          # same version as chromadb-client==1.0.12
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: ANONYMIZED_TELEMETRY, value: "FALSE"}
          readinessProbe:
            httpGet: {path: /api/v2/heartbeat, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/v2/heartbeat, port: 8000}
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /api/v2/heartbeat, port: 8000}
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - {name: chroma-data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: chroma-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
