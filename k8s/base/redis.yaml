# Redis: the semantic cache (ADR 0003), with an append-only file on a PVC so a restart
# does not empty the cache. A Deployment with Recreate: one pod, one RWO volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cache-data
  namespace: rahbar
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: rahbar
  labels: {app: redis}
spec:
  type: ClusterIP
  selector: {app: redis}
  ports:
    - {name: redis, port: 6379, targetPort: 6379}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: rahbar
  labels: {app: redis, app.kubernetes.io/part-of: rahbar}
spec:
  replicas: 1
  strategy:
    type: Recreate                  # never two pods on one RWO volume
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis, app.kubernetes.io/part-of: rahbar}
    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # local-path / hostPath provisioners (kind, minikube) ignore fsGroup, so the volume
        # is root-owned and the non-root server cannot write it. This init container is the
        # one exception to runAsNonRoot: it only chowns the data directory, with every
        # capability dropped except CHOWN, then exits.
        - name: fix-permissions
          image: busybox:1.37.0
          command: ["sh", "-c", "chown -R 999:1000 /data"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 16Mi}
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          volumeMounts:
            - {name: cache-data, mountPath: /data}
      containers:
        - name: redis
          image: redis:7.4.2-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--appendonly", "yes", "--dir", "/data",
                 "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 6379}
            periodSeconds: 20
          startupProbe:
            tcpSocket: {port: 6379}
            periodSeconds: 2
            failureThreshold: 15
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - {name: cache-data, mountPath: /data}
      volumes:
        - name: cache-data
          persistentVolumeClaim:
            claimName: cache-data
