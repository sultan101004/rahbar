# One ServiceAccount per workload (section 4.7). None of these pods calls the Kubernetes
# API, so none of them gets a token mounted.
apiVersion: v1
kind: ServiceAccount
metadata: {name: api, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: ui, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: indexer, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: chroma, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: redis, namespace: rahbar}
automountServiceAccountToken: false
